name: Recover stalled Material publication

on:
  push:
    branches: [main]
    paths: [.github/workflows/recover-material-publication.yml]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  release-stalled-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel the specifically authorized obsolete run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = 'randogelist/Methboke'
          run_id = 44061664660
          expected_sha = '5f0e7b72d4612657df7dfbd8191391026e871320'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          base = f'https://api.github.com/repos/{repo}/actions/runs/{run_id}'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28'}

          def request(suffix='', method='GET'):
              req = urllib.request.Request(base + suffix, headers=headers,
                                           method=method, data=b'' if method == 'POST' else None)
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read()
                  return json.loads(body) if body else {}

          def checked_run():
              run = request()
              if (run['head_sha'] != expected_sha or run['head_branch'] != 'main'
                      or run['path'] != '.github/workflows/material.yml'):
                  raise RuntimeError('Refusing cancellation: exact authorized run identity differs')
              return run

          def cancel(suffix):
              try:
                  request(suffix, 'POST')
              except urllib.error.HTTPError as error:
                  if error.code == 409 and checked_run()['status'] == 'completed':
                      return
                  raise

          if checked_run()['status'] == 'completed':
              print(f'Run {run_id} already completed; no cancellation needed.')
          else:
              cancel('/cancel')
              for _ in range(5):
                  time.sleep(2)
                  if checked_run()['status'] == 'completed':
                      break
              else:
                  cancel('/force-cancel')
                  print(f'Force cancellation requested for authorized run {run_id}.')
              print(f'Run {run_id}: {checked_run()["status"]}')
          PY
