name: Material / cached verification and passed objects

on:
  push:
    branches: [main, codex/reorganize-nse-domains, AC-Integration, integration/ac-into-main, codex/nse-a-r3-ehrenfest]
  workflow_dispatch:
    inputs:
      backend:
        description: 'Binary cache with automatic recovery, or the retained passed-container path'
        type: choice
        options: [binary_cache, registry]
        default: binary_cache
      exact_cache_benchmark:
        description: 'Require canonical exact dependency and project caches; no fallback'
        type: boolean
        default: false
      force_rebuild:
        description: 'Skip the fast job and rebuild fresh (binary backend only; incompatible with exact benchmark)'
        type: boolean
        default: false

concurrency:
  group: material-native-${{ github.repository }}-${{ github.ref }}
  # Fresh commits supersede obsolete runs; a manual rerun keeps queue semantics.
  cancel-in-progress: ${{ github.event_name == 'push' && github.run_attempt == 1 }}

permissions:
  contents: read
  packages: write

env:
  PYTHONUNBUFFERED: '1'
  MATERIAL_STATE: /tmp/material-native-state.json
  MATERIAL_JOBS: '2'
  MATERIAL_COMMAND_TIMEOUT: '1800'
  LEAN_NUM_THREADS: '2'
  EXACT_BENCHMARK: ${{ inputs.exact_cache_benchmark && 'true' || 'false' }}
  MATERIAL_BACKEND: ${{ inputs.exact_cache_benchmark && 'binary_cache' || inputs.backend || 'binary_cache' }}

jobs:
  compile-audit-register:
    name: Fast cached verification
    # A valid explicit rebuild selects recovery without manufacturing a failure.
    # Invalid rebuild/benchmark or rebuild/registry combinations fail in preflight.
    if: ${{ !inputs.force_rebuild || inputs.exact_cache_benchmark || inputs.backend == 'registry' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # The terminal result job, rather than this recoverable attempt, owns acceptance.
    continue-on-error: true
    outputs:
      accepted: ${{ steps.worker.outputs.accepted }}
      recovery-allowed: ${{ steps.worker.outputs.recovery-allowed }}
      failure-class: ${{ steps.worker.outputs.failure-class }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Try verified cached objects
        id: worker
        uses: ./.github/actions/material-worker
        with:
          worker-mode: fast
          backend: ${{ env.MATERIAL_BACKEND }}
          exact-cache-benchmark: ${{ inputs.exact_cache_benchmark && 'true' || 'false' }}
          force-rebuild: ${{ inputs.force_rebuild && 'true' || 'false' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  rebuild-and-reseed:
    name: Fresh runner rebuild and cache recovery
    needs: compile-audit-register
    # No theorem, audit, publication, cancellation or unknown failure can select recovery.
    if: ${{ !cancelled() && (inputs.force_rebuild || needs.compile-audit-register.outputs.recovery-allowed == 'true') && needs.compile-audit-register.outputs.accepted != 'true' && !inputs.exact_cache_benchmark && (inputs.backend == '' || inputs.backend == 'binary_cache') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      accepted: ${{ steps.worker.outputs.accepted }}
    steps:
      - name: Checkout the same exact source on a fresh runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Rebuild every own module, audit and publish replacement objects
        id: worker
        uses: ./.github/actions/material-worker
        with:
          worker-mode: recovery
          backend: binary_cache
          exact-cache-benchmark: 'false'
          force-rebuild: ${{ inputs.force_rebuild && 'true' || 'false' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  material-result:
    name: Material accepted
    needs: [compile-audit-register, rebuild-and-reseed]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a fully verified and published result
        env:
          PRIMARY_ACCEPTED: ${{ needs.compile-audit-register.outputs.accepted }}
          RECOVERY_ACCEPTED: ${{ needs.rebuild-and-reseed.outputs.accepted }}
          PRIMARY_RESULT: ${{ needs.compile-audit-register.result }}
          PRIMARY_FAILURE_CLASS: ${{ needs.compile-audit-register.outputs.failure-class }}
          RECOVERY_RESULT: ${{ needs.rebuild-and-reseed.result }}
        run: |
          if [ "$PRIMARY_ACCEPTED" = true ]; then
            echo 'Material accepted: cached verification and required publication passed.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$RECOVERY_ACCEPTED" = true ]; then
            echo 'Material accepted: fresh recovery rebuilt every own module, audited and published replacement objects.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Material rejected: no accepted worker (primary=$PRIMARY_RESULT, class=$PRIMARY_FAILURE_CLASS, recovery=$RECOVERY_RESULT)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  r3-foundations:
    name: R3 foundations / exact types and axioms (root open)
    needs: material-result
    if: >-
      !cancelled() &&
      github.repository == 'randogelist/Methboke' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/nse-a-r3-ehrenfest' &&
      needs.material-result.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      PYTHONUNBUFFERED: '1'
      LEAN_NUM_THREADS: '2'
      MATERIAL_COMMAND_TIMEOUT: '1800'
      MATERIAL_PARENT_ACCEPTED: ${{ needs.material-result.result == 'success' && 'true' || 'false' }}
      TARGET_SHA: ${{ github.sha }}
      GOAL_ID: SINGULAR_PREMISE_OBSTRUCT_R3

    steps:
      - name: Checkout the exact verified source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check scope-runner controls without invoking Lean
        run: python3 -m unittest discover -s scripts/tests -p 'test_theorem_goal.py'

      - name: Record theorem scope, exact revision and compatible cache keys
        id: plan
        run: >-
          python3 scripts/verify_theorem_goal.py plan
          --goal "$GOAL_ID" --revision "$TARGET_SHA" --output "$RUNNER_TEMP/theorem-goal"
          --github-output "$GITHUB_OUTPUT"

      - name: Reclaim unused disposable runner SDKs
        run: bash Material/ci/prepare-runner.sh --mode warm

      - name: Find a repaired dependency cache
        id: repaired-dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: Material/.lake/packages
          key: ${{ steps.plan.outputs.dependency_key }}-recovered-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.plan.outputs.dependency_key }}-recovered-
          lookup-only: true

      - name: Restore the pinned dependency objects
        id: dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: Material/.lake/packages
          key: ${{ steps.repaired-dependencies.outputs.cache-matched-key || steps.plan.outputs.dependency_key }}

      - name: Find a repaired project cache
        id: repaired-project
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            Material/.lake/build
            Material/registry/current.json
          key: ${{ steps.plan.outputs.project_key }}-recovered-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.plan.outputs.project_key }}-recovered-
          lookup-only: true

      - name: Restore passed project objects and their original receipts
        id: project
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            Material/.lake/build
            Material/registry/current.json
          key: ${{ steps.repaired-project.outputs.cache-matched-key || steps.plan.outputs.project_key }}
          restore-keys: ${{ steps.plan.outputs.project_prefix }}

      - name: Require a complete passed cache donor before compiler setup
        env:
          DEPENDENCY_HIT: ${{ steps.dependencies.outputs.cache-hit }}
          DEPENDENCY_MATCHED: ${{ steps.dependencies.outputs.cache-matched-key }}
          PROJECT_HIT: ${{ steps.project.outputs.cache-hit }}
          PROJECT_MATCHED: ${{ steps.project.outputs.cache-matched-key }}
        run: >-
          python3 scripts/verify_theorem_goal.py admit
          --goal "$GOAL_ID" --revision "$TARGET_SHA" --output "$RUNNER_TEMP/theorem-goal"

      - name: Install the checksum-pinned native toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz --output "$RUNNER_TEMP/elan.tar.gz"
          printf '%s  %s\n' '42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63' "$RUNNER_TEMP/elan.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat Material/lean-toolchain)"

      - name: Validate cached closure and freshly audit this goal's complete scope
        env:
          DEPENDENCY_HIT: ${{ steps.dependencies.outputs.cache-hit }}
          DEPENDENCY_MATCHED: ${{ steps.dependencies.outputs.cache-matched-key }}
          PROJECT_HIT: ${{ steps.project.outputs.cache-hit }}
          PROJECT_MATCHED: ${{ steps.project.outputs.cache-matched-key }}
        run: >-
          python3 scripts/verify_theorem_goal.py verify
          --goal "$GOAL_ID" --revision "$TARGET_SHA" --output "$RUNNER_TEMP/theorem-goal"

      - name: Retain explicit goal status and any real audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: theorem-goal-${{ env.GOAL_ID }}-${{ env.TARGET_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/theorem-goal
          if-no-files-found: error
          retention-days: 90

