name: Main / retire preserved candidate

on:
  push:
    branches: [main]
    paths: ['.github/workflows/main-consolidation.yml']
  workflow_dispatch:

permissions: {}

jobs:
  retire-candidate:
    if: github.repository == 'randogelist/Methboke' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - name: Retire only the exact candidate already preserved in main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_CANDIDATE: a95e76a4c539ac2859848cd04acef95aea6dda4d
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = 'randogelist/Methboke'
          branch = 'Clay-Admission-Candidate-01'
          expected = os.environ['EXPECTED_CANDIDATE']
          def api(path, method='GET'):
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repo + '/' + path,
                  method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = response.read()
                  return json.loads(data) if data else None

          comparison = api('compare/' + expected + '...main')
          if comparison['status'] not in ('ahead', 'identical'):
              raise SystemExit('Refusing cleanup: main does not preserve candidate history.')
          try:
              ref = api('git/ref/heads/' + branch)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              ref = None
          if ref is not None:
              if ref['object']['sha'] != expected:
                  raise SystemExit('Refusing cleanup: candidate changed after review.')
              api('git/refs/heads/' + branch, 'DELETE')
              print('Retired preserved candidate branch at ' + expected)
          else:
              print('Candidate branch is already retired.')

          # Only the two known obsolete executions are eligible for cancellation.
          superseded = {
              44027064191: 'e020eb58ede4912ad7b71b95172634aee7a58261',
              44028906480: expected,
          }
          for run_id, sha in superseded.items():
              run = api('actions/runs/' + str(run_id))
              if run['head_branch'] != branch or run['head_sha'] != sha:
                  raise SystemExit('Unexpected historical run identity; refusing cancellation.')
              if run['status'] == 'completed':
                  continue
              try:
                  api('actions/runs/' + str(run_id) + '/cancel', 'POST')
                  print('Cancelled superseded candidate run ' + str(run_id))
              except urllib.error.HTTPError as exc:
                  if exc.code != 409:
                      raise
                  print('Run no longer cancellable: ' + str(run_id))
          PY
