name: QFA / one-shot source field bridge

on:
  push:
    branches: [codex/qfa-structured-assembly]
    paths:
      - '.github/workflows/qfa-register-source-fields.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/qfa-structured-assembly
          fetch-depth: 1

      - name: Register exact source-field endpoint
        env:
          ENDPOINT_ID: QFASourceFields
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, json, os, shutil, sys
          from pathlib import Path

          root = Path.cwd()
          material = root / 'Material'
          endpoint_id = os.environ['ENDPOINT_ID']
          staging = root / 'R3_NSE/QFA/STRUCTURED_ASSEMBLY/STAGING/QFASourceFields'
          package = material / endpoint_id
          if package.exists():
              raise SystemExit(f'{package} already exists')
          package.mkdir(parents=True)
          shutil.copyfile(staging / 'Endpoint.lean.txt', package / 'Endpoint.lean')
          shutil.copyfile(staging / 'Audit.lean.txt', package / 'Audit.lean')

          names = [
            'MethbokeAddon.QuasiFeffermanA.SourceFields.SourceVectorField',
            'MethbokeAddon.QuasiFeffermanA.SourceFields.SourceSpatialL2',
            'MethbokeAddon.QuasiFeffermanA.SourceFields.sourceFieldFunctionOfNative',
            'MethbokeAddon.QuasiFeffermanA.SourceFields.nativeFieldFunctionOfSource',
            'MethbokeAddon.QuasiFeffermanA.SourceFields.nativeFieldFunctionOfSource_sourceFieldFunctionOfNative',
            'MethbokeAddon.QuasiFeffermanA.SourceFields.sourceFieldFunctionOfNative_nativeFieldFunctionOfSource',
            'MethbokeAddon.QuasiFeffermanA.SourceFields.sourceFieldOfNative_memLp',
            'MethbokeAddon.QuasiFeffermanA.SourceFields.sourceL2OfNative',
            'MethbokeAddon.QuasiFeffermanA.SourceFields.sourceL2OfNative_ae',
            'MethbokeAddon.QuasiFeffermanA.SourceFields.nativeFieldOfSource_memLp',
            'MethbokeAddon.QuasiFeffermanA.SourceFields.nativeL2OfSource',
            'MethbokeAddon.QuasiFeffermanA.SourceFields.nativeL2OfSource_ae',
            'MethbokeAddon.QuasiFeffermanA.SourceFields.sourceFieldOfNative_euclideanNorm',
            'MethbokeAddon.QuasiFeffermanA.SourceFields.nativeFieldOfSource_norm',
          ]
          definitions = {names[0], names[1], names[2], names[3], names[7], names[10]}
          scopes = {
            names[0]: 'Raw source-coordinate spatial vector-field type.',
            names[1]: 'Source-coordinate spatial L2 class with the source raw finite-Pi norm.',
            names[2]: 'Pointwise pullback of a native Euclidean-valued field to source coordinates.',
            names[3]: 'Pointwise pushforward of a source-coordinate field to native Euclidean space.',
            names[4]: 'Pointwise left inverse law for field transport.',
            names[5]: 'Pointwise right inverse law for field transport.',
            names[6]: 'Native spatial L2 fields pull back to source MemLp 2.',
            names[7]: 'Source spatial L2 class induced by a native spatial L2 field.',
            names[8]: 'Almost-everywhere representative identity for sourceL2OfNative.',
            names[9]: 'Source spatial L2 fields push forward to native MemLp 2.',
            names[10]: 'Native spatial L2 class induced by a source spatial L2 field.',
            names[11]: 'Almost-everywhere representative identity for nativeL2OfSource.',
            names[12]: 'Exact physical Euclidean norm of a pulled-back native field.',
            names[13]: 'Exact native norm of a pushed-forward source field.',
          }
          declarations = [{
            'name': name,
            'kind': 'definition' if name in definitions else 'theorem',
            'source': {
              'repository': 'randogelist/Methboke',
              'path': f'Material/{endpoint_id}/Endpoint.lean',
              'module': f'{endpoint_id}.Endpoint',
              'revision_status': 'FIRST_MATCHING_EXTERNAL_VERIFICATION_PENDING',
            },
            'scope': scopes[name],
          } for name in names]
          manifest = {
            'schema_version': 1,
            'id': endpoint_id,
            'endpoint_module': f'{endpoint_id}.Endpoint',
            'audit_module': f'{endpoint_id}.Audit',
            'imports': [
              'QFASourceCoordinates.Endpoint',
              'Mathlib.MeasureTheory.Function.LpSpace.Basic',
            ],
            'source_roots': [{
              'module': 'QFASourceCoordinates.Endpoint',
              'path': 'QFASourceCoordinates/Endpoint.lean',
              'storage': 'endpoint_dependency',
              'origin_kind': 'accepted_native_dependency',
            }],
            'reference_sources': [{
              'repository': 'scottnarmstrong/CaffarelliKohnNirenberg',
              'revision': '381d658ead0f03a18361965cc0427ce3fa5844ab',
              'files': ['CKN/Foundation/Sobolev/Ambient/Basic.lean',
                        'CKN/Foundation/Ambient/Euclidean.lean'],
              'role': 'Raw coordinate vector-field carrier and physical Euclidean norm; reference only.',
            }, {
              'repository': 'leanprover-community/mathlib4',
              'revision': 'db584cd6d46c92f209a44c0f1c829460d327499d',
              'files': ['Mathlib/MeasureTheory/Function/LpSpace/Basic.lean'],
              'role': 'MemLp composition, continuous-linear codomain transport, and Lp representatives.',
            }],
            'declarations': declarations,
            'allowed_axioms': ['propext', 'Classical.choice', 'Quot.sound'],
            'scope': 'Exact pointwise and L2 transport of spatial vector fields between accepted source coordinates and Methboke native Euclidean space, with exact physical pointwise Euclidean norm transport.',
            'status': 'PENDING_MATCHING_EXTERNAL_CI',
            'project_scope': 'QFA_A_TIER_CLOSURE',
            'implementation_base': os.environ['GITHUB_SHA'],
            'research_layout': 'R3_NSE/QFA/STRUCTURED_ASSEMBLY',
            'derivation_chain': 'R3_NSE/QFA/STRUCTURED_ASSEMBLY/ASSEMBLY_MANIFEST.txt',
            'type_policy': 'Independent exact consumers and fresh named exact-type and theorem-level axiom reports for every declaration.',
            'physical_qfa_root_proved': False,
            'local_lean_executed': False,
          }
          (package / 'endpoint.json').write_text(json.dumps(manifest, indent=2) + '\n')
          (package / 'README.md').write_text(
            '# QFA source/native spatial fields\n\n'
            'This endpoint lifts the accepted coordinate bridge to actual spatial vector fields. '
            'It supplies pointwise inverse laws, source and native `L²` classes in both directions, '
            'almost-everywhere representative identities, and exact pointwise physical Euclidean-norm transport.\n\n'
            'It does not prove source solenoidality, CKN `IsInJ`, an ESS good-time contract, any PDE construction, or either QFA root.\n')

          sys.path.insert(0, str(material / 'ci'))
          import build
          plan = build.validate(material)
          entry = next(item for item in plan['endpoints'] if item['id'] == endpoint_id)
          closure = {
            'schema_version': 1,
            'endpoint': endpoint_id,
            'source_revision_status': 'FIRST_MATCHING_EXTERNAL_VERIFICATION_PENDING',
            'source_baseline': os.environ['GITHUB_SHA'],
            'lean_toolchain': plan['toolchain'],
            'mathlib_commit': plan['mathlib_commit'],
            'roots': [entry['spec']['endpoint_module'], entry['spec']['audit_module']],
            'files': entry['files'],
            'external_imports': entry['external_imports'],
            'source_drift': entry['source_drift'],
          }
          closure_bytes = (json.dumps(closure, indent=2, sort_keys=True) + '\n').encode()
          (package / 'closure.json').write_bytes(closure_bytes)

          index_path = material / 'endpoints.json'
          index = json.loads(index_path.read_text())
          rows = index['endpoints']
          if any(row.get('id') == endpoint_id for row in rows):
              raise SystemExit(f'{endpoint_id} already registered')
          rows.append({
            'id': endpoint_id,
            'endpoint_module': entry['spec']['endpoint_module'],
            'audit_module': entry['spec']['audit_module'],
            'manifest': f'{endpoint_id}/endpoint.json',
            'closure': f'{endpoint_id}/closure.json',
            'declarations': len(entry['spec']['declarations']),
            'local_source_modules': len(entry['files']),
            'source_closure_sha256': hashlib.sha256(closure_bytes).hexdigest(),
          })
          index['endpoint_count'] = len(rows)
          index['declaration_count'] = sum(int(row['declarations']) for row in rows)
          index_path.write_text(json.dumps(index, indent=2) + '\n')

          assert len(names) == 14
          assert index['endpoint_count'] == 172
          assert index['declaration_count'] == 2248
          assert {row['id'] for row in rows} == set(plan['all_endpoint_ids'])
          print(json.dumps({
            'endpoint_count': index['endpoint_count'],
            'declaration_count': index['declaration_count'],
            'registered': endpoint_id,
            'local_source_modules': len(entry['files']),
            'closure_sha256': hashlib.sha256(closure_bytes).hexdigest(),
          }, indent=2))
          PY

      - name: Remove staging payload and commit exact package
        run: |
          rm -rf R3_NSE/QFA/STRUCTURED_ASSEMBLY/STAGING/QFASourceFields
          rm .github/workflows/qfa-register-source-fields.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Material/QFASourceFields Material/endpoints.json \
            R3_NSE/QFA/STRUCTURED_ASSEMBLY/STAGING/QFASourceFields \
            .github/workflows/qfa-register-source-fields.yml
          git commit -m 'feat(qfa): add exact source field bridge'
          git push origin HEAD:codex/qfa-structured-assembly
