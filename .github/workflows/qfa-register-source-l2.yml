name: QFA / one-shot raw source L2

on:
  push:
    branches: [codex/qfa-structured-assembly]
    paths:
      - '.github/workflows/qfa-register-source-l2.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/qfa-structured-assembly
          fetch-depth: 1
      - name: Register exact raw source L2 endpoint
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, json, shutil, sys
          from pathlib import Path

          root=Path.cwd(); material=root/'Material'; eid='QFASourceL2'
          staging=root/'R3_NSE/QFA/STRUCTURED_ASSEMBLY/STAGING/QFASourceL2'
          package=material/eid
          if package.exists(): raise SystemExit(f'{package} already exists')
          package.mkdir(parents=True)
          shutil.copyfile(staging/'Endpoint.lean.txt',package/'Endpoint.lean')
          shutil.copyfile(staging/'Audit.lean.txt',package/'Audit.lean')
          names=[
            'MethbokeAddon.QuasiFeffermanA.SourceL2.SourceSpatialL2',
            'MethbokeAddon.QuasiFeffermanA.SourceL2.sourceFieldFunctionOfNative_memLp',
            'MethbokeAddon.QuasiFeffermanA.SourceL2.sourceFieldFunctionOfNative_aestronglyMeasurable',
            'MethbokeAddon.QuasiFeffermanA.SourceL2.sourceSpatialL2OfNative',
            'MethbokeAddon.QuasiFeffermanA.SourceL2.sourceSpatialL2OfNative_coeFn',
            'MethbokeAddon.QuasiFeffermanA.SourceL2.nativeFieldFunctionOfSource_memLp',
            'MethbokeAddon.QuasiFeffermanA.SourceL2.sourceField_memLp_iff_nativeField_memLp',
          ]
          kinds=['definition','theorem','theorem','definition','theorem','theorem','theorem']
          scopes=[
            'Raw source-coordinate L2 equivalence-class type.',
            'Genuine MemLp 2 admission for a native SpatialL2 field transported to source coordinates.',
            'A.e.-strong measurability of the transported raw source field.',
            'Canonical source-coordinate L2 class represented by a native SpatialL2 field.',
            'A.e. representative identity for sourceSpatialL2OfNative.',
            'Reverse qualitative MemLp transport from a raw source field to native coordinates.',
            'Two-way raw/native MemLp equivalence for a source vector field.',
          ]
          decls=[{'name':n,'kind':k,'source':{'repository':'randogelist/Methboke',
            'path':f'Material/{eid}/Endpoint.lean','module':f'{eid}.Endpoint',
            'revision_status':'FIRST_MATCHING_EXTERNAL_VERIFICATION_PENDING'},'scope':s}
            for n,k,s in zip(names,kinds,scopes)]
          manifest={'schema_version':1,'id':eid,'endpoint_module':f'{eid}.Endpoint','audit_module':f'{eid}.Audit',
            'imports':['QFASourceFields.Endpoint','Mathlib.MeasureTheory.Function.LpSpace.Basic'],
            'source_roots':[{'module':'QFASourceFields.Endpoint','path':'QFASourceFields/Endpoint.lean',
              'storage':'endpoint_dependency','origin_kind':'accepted_native_dependency'}],
            'reference_sources':[{'repository':'scottnarmstrong/CaffarelliKohnNirenberg',
              'revision':'381d658ead0f03a18361965cc0427ce3fa5844ab',
              'files':['CKN/Statements/IsInJ.lean'],
              'role':'Raw source MemLp input expected by the selected CKN IsInJ facade; reference only.'},
              {'repository':'leanprover-community/mathlib4','revision':'db584cd6d46c92f209a44c0f1c829460d327499d',
              'files':['Mathlib/MeasureTheory/Function/LpSeminorm/Basic.lean','Mathlib/MeasureTheory/Function/LpSpace/Basic.lean'],
              'role':'Measure-preserving composition, continuous-linear value transport, and Lp representative construction.'}],
            'declarations':decls,'allowed_axioms':['propext','Classical.choice','Quot.sound'],
            'scope':'Exact qualitative raw-source MemLp/L2 admission and two-way field transport.',
            'status':'PENDING_MATCHING_EXTERNAL_CI','project_scope':'QFA_A_TIER_CLOSURE',
            'implementation_base':'${{ github.sha }}','research_layout':'R3_NSE/QFA/STRUCTURED_ASSEMBLY',
            'derivation_chain':'R3_NSE/QFA/STRUCTURED_ASSEMBLY/ASSEMBLY_MANIFEST.txt',
            'type_policy':'Independent exact consumers and fresh named exact-type and theorem-level axiom reports for every declaration.',
            'physical_qfa_root_proved':False,'local_lean_executed':False}
          (package/'endpoint.json').write_text(json.dumps(manifest,indent=2)+'\n')
          (package/'README.md').write_text('# QFA raw source L2\n\nExact qualitative MemLp/L2 transport between native SpatialL2 fields and the raw source-coordinate carrier. Weak divergence and IsInJ are separate.\n')
          sys.path.insert(0,str(material/'ci')); import build
          plan=build.validate(material); entry=next(e for e in plan['endpoints'] if e['id']==eid)
          closure={'schema_version':1,'endpoint':eid,'source_revision_status':'FIRST_MATCHING_EXTERNAL_VERIFICATION_PENDING',
            'source_baseline':'${{ github.sha }}','lean_toolchain':plan['toolchain'],'mathlib_commit':plan['mathlib_commit'],
            'roots':[entry['spec']['endpoint_module'],entry['spec']['audit_module']],
            'files':entry['files'],'external_imports':entry['external_imports'],'source_drift':entry['source_drift']}
          cb=(json.dumps(closure,indent=2,sort_keys=True)+'\n').encode(); (package/'closure.json').write_bytes(cb)
          ip=material/'endpoints.json'; idx=json.loads(ip.read_text()); rows=idx['endpoints']
          if any(r.get('id')==eid for r in rows): raise SystemExit(f'{eid} already registered')
          rows.append({'id':eid,'endpoint_module':entry['spec']['endpoint_module'],'audit_module':entry['spec']['audit_module'],
            'manifest':f'{eid}/endpoint.json','closure':f'{eid}/closure.json','declarations':len(decls),
            'local_source_modules':len(entry['files']),'source_closure_sha256':hashlib.sha256(cb).hexdigest()})
          idx['endpoint_count']=len(rows); idx['declaration_count']=sum(int(r['declarations']) for r in rows)
          ip.write_text(json.dumps(idx,indent=2)+'\n')
          assert idx['endpoint_count']==174 and idx['declaration_count']==2256 and len(decls)==7
          assert {r['id'] for r in rows}==set(plan['all_endpoint_ids'])
          print(json.dumps({'endpoint_count':174,'declaration_count':2256,'registered':eid},indent=2))
          PY
      - name: Remove staging and commit
        run: |
          rm -rf R3_NSE/QFA/STRUCTURED_ASSEMBLY/STAGING/QFASourceL2
          rm .github/workflows/qfa-register-source-l2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Material/QFASourceL2 Material/endpoints.json \
            R3_NSE/QFA/STRUCTURED_ASSEMBLY/STAGING/QFASourceL2 \
            .github/workflows/qfa-register-source-l2.yml
          git commit -m 'feat(qfa): add exact raw source L2 admission'
          git push origin HEAD:codex/qfa-structured-assembly
