name: QFA / revise source field bridge

on:
  push:
    branches: [codex/qfa-structured-assembly]
    paths:
      - '.github/workflows/qfa-revise-source-fields.yml'

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/qfa-structured-assembly
          fetch-depth: 1
      - name: Replace endpoint and regenerate metadata
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, json, shutil, sys
          from pathlib import Path

          root = Path.cwd(); material = root/'Material'; eid = 'QFASourceFields'
          staging = root/'R3_NSE/QFA/STRUCTURED_ASSEMBLY/STAGING/QFASourceFieldsPointwise'
          package = material/eid
          shutil.copyfile(staging/'Endpoint.lean.txt', package/'Endpoint.lean')
          shutil.copyfile(staging/'Audit.lean.txt', package/'Audit.lean')

          names = [
            'MethbokeAddon.QuasiFeffermanA.SourceFields.SourceVectorField',
            'MethbokeAddon.QuasiFeffermanA.SourceFields.sourceFieldFunctionOfNative',
            'MethbokeAddon.QuasiFeffermanA.SourceFields.nativeFieldFunctionOfSource',
            'MethbokeAddon.QuasiFeffermanA.SourceFields.sourceFieldFunctionOfNative_apply',
            'MethbokeAddon.QuasiFeffermanA.SourceFields.nativeFieldFunctionOfSource_apply',
            'MethbokeAddon.QuasiFeffermanA.SourceFields.nativeFieldFunctionOfSource_sourceFieldFunctionOfNative',
            'MethbokeAddon.QuasiFeffermanA.SourceFields.sourceFieldFunctionOfNative_nativeFieldFunctionOfSource',
            'MethbokeAddon.QuasiFeffermanA.SourceFields.sourceFieldOfNative_euclideanNorm',
            'MethbokeAddon.QuasiFeffermanA.SourceFields.nativeFieldOfSource_norm',
          ]
          definitions = set(names[:3])
          scopes = [
            'Raw source-coordinate spatial vector-field type.',
            'Pointwise pullback of a native Euclidean-valued field to source coordinates.',
            'Pointwise pushforward of a source-coordinate field to native Euclidean space.',
            'Literal application formula for sourceFieldFunctionOfNative.',
            'Literal application formula for nativeFieldFunctionOfSource.',
            'Pointwise left inverse law for field transport.',
            'Pointwise right inverse law for field transport.',
            'Exact physical Euclidean norm of a pulled-back native field.',
            'Exact native norm of a pushed-forward source field.',
          ]
          decls = [{
            'name': n,
            'kind': 'definition' if n in definitions else 'theorem',
            'source': {'repository':'randogelist/Methboke','path':f'Material/{eid}/Endpoint.lean',
              'module':f'{eid}.Endpoint','revision_status':'FIRST_MATCHING_EXTERNAL_VERIFICATION_PENDING'},
            'scope': s,
          } for n,s in zip(names,scopes)]
          manifest = {
            'schema_version':1,'id':eid,'endpoint_module':f'{eid}.Endpoint','audit_module':f'{eid}.Audit',
            'imports':['QFASourceCoordinates.Endpoint'],
            'source_roots':[{'module':'QFASourceCoordinates.Endpoint','path':'QFASourceCoordinates/Endpoint.lean',
              'storage':'endpoint_dependency','origin_kind':'accepted_native_dependency'}],
            'reference_sources':[{'repository':'scottnarmstrong/CaffarelliKohnNirenberg',
              'revision':'381d658ead0f03a18361965cc0427ce3fa5844ab',
              'files':['CKN/Foundation/Sobolev/Ambient/Basic.lean','CKN/Foundation/Ambient/Euclidean.lean'],
              'role':'Raw coordinate vector-field carrier and physical Euclidean norm; reference only.'}],
            'declarations':decls,'allowed_axioms':['propext','Classical.choice','Quot.sound'],
            'scope':'Exact pointwise source/native spatial vector-field equivalence and exact physical Euclidean-norm transport.',
            'status':'PENDING_MATCHING_EXTERNAL_CI','project_scope':'QFA_A_TIER_CLOSURE',
            'implementation_base': '${{ github.sha }}',
            'research_layout':'R3_NSE/QFA/STRUCTURED_ASSEMBLY',
            'derivation_chain':'R3_NSE/QFA/STRUCTURED_ASSEMBLY/ASSEMBLY_MANIFEST.txt',
            'type_policy':'Independent exact consumers and fresh named exact-type and theorem-level axiom reports for every declaration.',
            'physical_qfa_root_proved':False,'local_lean_executed':False,
          }
          (package/'endpoint.json').write_text(json.dumps(manifest,indent=2)+'\n')
          (package/'README.md').write_text('# QFA pointwise source/native fields\n\nExact pointwise field conversion, inverse laws, and physical Euclidean-norm transport. Raw-source `L²` admission is isolated to a later package. No PDE or QFA conclusion is asserted.\n')

          sys.path.insert(0,str(material/'ci')); import build
          plan=build.validate(material); entry=next(e for e in plan['endpoints'] if e['id']==eid)
          closure={'schema_version':1,'endpoint':eid,'source_revision_status':'FIRST_MATCHING_EXTERNAL_VERIFICATION_PENDING',
            'source_baseline':'${{ github.sha }}','lean_toolchain':plan['toolchain'],'mathlib_commit':plan['mathlib_commit'],
            'roots':[entry['spec']['endpoint_module'],entry['spec']['audit_module']],
            'files':entry['files'],'external_imports':entry['external_imports'],'source_drift':entry['source_drift']}
          cb=(json.dumps(closure,indent=2,sort_keys=True)+'\n').encode(); (package/'closure.json').write_bytes(cb)

          ip=material/'endpoints.json'; idx=json.loads(ip.read_text()); row=next(r for r in idx['endpoints'] if r['id']==eid)
          row.update({'declarations':len(decls),'local_source_modules':len(entry['files']),
            'source_closure_sha256':hashlib.sha256(cb).hexdigest()})
          idx['endpoint_count']=len(idx['endpoints']); idx['declaration_count']=sum(int(r['declarations']) for r in idx['endpoints'])
          ip.write_text(json.dumps(idx,indent=2)+'\n')
          assert len(decls)==9 and idx['endpoint_count']==172 and idx['declaration_count']==2243
          assert {r['id'] for r in idx['endpoints']}==set(plan['all_endpoint_ids'])
          print(json.dumps({'endpoint_count':172,'declaration_count':2243,'registered':eid},indent=2))
          PY
      - name: Remove staging and commit
        run: |
          rm -rf R3_NSE/QFA/STRUCTURED_ASSEMBLY/STAGING/QFASourceFieldsPointwise
          rm .github/workflows/qfa-revise-source-fields.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Material/QFASourceFields Material/endpoints.json \
            R3_NSE/QFA/STRUCTURED_ASSEMBLY/STAGING/QFASourceFieldsPointwise \
            .github/workflows/qfa-revise-source-fields.yml
          git commit -m 'refactor(qfa): isolate pointwise source field bridge'
          git push origin HEAD:codex/qfa-structured-assembly
