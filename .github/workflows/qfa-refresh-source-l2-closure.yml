name: QFA source L2 closure refresh

on:
  push:
    branches:
      - codex/qfa-structured-assembly
    paths:
      - .github/workflows/qfa-refresh-source-l2-closure.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/qfa-structured-assembly
          fetch-depth: 1
      - name: Refresh closure metadata
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd()
          material = root / "Material"
          endpoint_id = "QFASourceL2"
          sys.path.insert(0, str(material / "ci"))
          import build

          plan = build.validate(material)
          entry = next(e for e in plan["endpoints"] if e["id"] == endpoint_id)
          source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          closure = {
              "schema_version": 1,
              "endpoint": endpoint_id,
              "source_revision_status": "REPAIRED_PENDING_MATCHING_EXTERNAL_VERIFICATION",
              "source_baseline": source,
              "lean_toolchain": plan["toolchain"],
              "mathlib_commit": plan["mathlib_commit"],
              "roots": [entry["spec"]["endpoint_module"], entry["spec"]["audit_module"]],
              "files": entry["files"],
              "external_imports": entry["external_imports"],
              "source_drift": entry["source_drift"],
          }
          closure_bytes = (json.dumps(closure, indent=2, sort_keys=True) + "\n").encode()
          (material / endpoint_id / "closure.json").write_bytes(closure_bytes)

          index_path = material / "endpoints.json"
          index = json.loads(index_path.read_text())
          row = next(r for r in index["endpoints"] if r["id"] == endpoint_id)
          assert row["declarations"] == 7
          row["source_closure_sha256"] = hashlib.sha256(closure_bytes).hexdigest()
          index_path.write_text(json.dumps(index, indent=2) + "\n")
          assert index["endpoint_count"] == 174
          assert index["declaration_count"] == 2256
          print(json.dumps({
              "endpoint": endpoint_id,
              "source": source,
              "files": len(entry["files"]),
              "source_drift": entry["source_drift"],
              "closure_sha256": row["source_closure_sha256"],
          }, indent=2))
          PY
      - name: Commit refreshed closure
        run: |
          rm .github/workflows/qfa-refresh-source-l2-closure.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Material/QFASourceL2/closure.json Material/endpoints.json \
            .github/workflows/qfa-refresh-source-l2-closure.yml
          git commit -m 'chore(qfa): refresh raw source L2 closure'
          git push origin HEAD:codex/qfa-structured-assembly
