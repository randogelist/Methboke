name: Lean source line count

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-line-count-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  count-lean-lines:
    name: Count Lean source lines and check README
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Count tracked Lean text and verify README
        run: >-
          python3 scripts/count_lean_lines.py
          --check-readme
          --output "$RUNNER_TEMP/lean-line-count.json"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Retain the per-file count
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lean-source-lines-${{ github.sha }}
          path: ${{ runner.temp }}/lean-line-count.json
          if-no-files-found: error
          retention-days: 90
