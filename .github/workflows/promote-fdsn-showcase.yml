name: Promote FDSN showcase

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/promote-fdsn-showcase.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add the accepted T3 and R3 FDSN roots to the main showcase
        shell: python
        run: |
          from pathlib import Path

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme_anchor = (
              "This latest six-goal declaration supersedes the earlier configurations. Existing\n"
              "results, explicit hypotheses and source-specific evidence retain their status.\n"
          )
          showcase = r"""## Main showcased theorems

| Marker | Domain | Canonical theorem | Exact accepted statement | Evidence |
|---|---|---|---|---|
| **`!!!!`** | $\mathbb T^3$ | `MethbokeAddon.FDSN.FEFFERMAN_D_SPECTRAL_NONRIGIDITY` | `∀ ν T U p F, Seed ν T U p F → Family ν T U p F` | [A-tier register](T3_NSE/D-Family-Obstruction/FDSN/A_TIER_REGISTER.txt), [run 44811785125](https://github.com/randogelist/Methboke/actions/runs/44811785125) |
| **`!!!!`** | $\mathbb R^3$ | `MethbokeAddon.FDSNR3.FDSN_R3` | `∀ ν T u p F, Seed ν T u p F → Family ν T u p F` | [implementation ledger](R3_NSE/FDSN/IMPLEMENTATION_STATUS.json), [run 44848985720](https://github.com/randogelist/Methboke/actions/runs/44848985720) |

For both rows, `!!!!` records A-tier closure of the exact same-witness
seed-to-family theorem with only `propext`, `Classical.choice` and `Quot.sound`
in the theorem-level audit. The original `Seed` premise remains part of each
statement; neither row asserts seed existence. The accepted T³ source is
`87ab6b4cfc4a81a1fb6c8e37bb6d5caf3972b1ef`, and the accepted ℝ³ source is
`572fd9ee69a6b641f435cbfb2ef74e034809c583`.
"""
          if "## Main showcased theorems" not in readme:
              if readme_anchor not in readme:
                  raise SystemExit("README showcase insertion anchor not found")
              readme = readme.replace(readme_anchor, readme_anchor + "\n" + showcase + "\n", 1)
              readme_path.write_text(readme, encoding="utf-8")

          status_lines = (
              "MAIN_SHOWCASED_THEOREMS = {T3_FDSN: !!!!, R3_FDSN: !!!!}\n"
              "T3_FDSN_SHOWCASE = MethbokeAddon.FDSN.FEFFERMAN_D_SPECTRAL_NONRIGIDITY; exact Seed -> Family; accepted at 87ab6b4cfc4a81a1fb6c8e37bb6d5caf3972b1ef; run 44811785125\n"
              "R3_FDSN_SHOWCASE = MethbokeAddon.FDSNR3.FDSN_R3; exact Seed -> Family; accepted at 572fd9ee69a6b641f435cbfb2ef74e034809c583; run 44848985720\n"
              "SHOWCASE_MARKER_SCOPE = !!!! means A-tier closure of the exact stated implication; original Seed premises retained; no seed-existence promotion\n"
          )

          gpt_path = Path("GPT.txt")
          gpt = gpt_path.read_text(encoding="utf-8")
          gpt = gpt.replace("DOCUMENT_VERSION = 8.7", "DOCUMENT_VERSION = 8.8", 1)
          gpt_anchor = "CURRENT_FDSN_R3_LEDGER = R3_NSE/FDSN/IMPLEMENTATION_STATUS.json\n"
          if "MAIN_SHOWCASED_THEOREMS = {T3_FDSN: !!!!, R3_FDSN: !!!!}" not in gpt:
              if gpt_anchor not in gpt:
                  raise SystemExit("GPT showcase insertion anchor not found")
              gpt = gpt.replace(gpt_anchor, gpt_anchor + status_lines, 1)
          gpt_path.write_text(gpt, encoding="utf-8")

          index_path = Path("INDEX-WORTHY.txt")
          index = index_path.read_text(encoding="utf-8")
          index = index.replace("DOCUMENT_VERSION = 8.7", "DOCUMENT_VERSION = 8.8", 1)
          index_anchor = "CURRENT_FDSN_R3_EVIDENCE = audits/fdsn-r3-572fd9ee-accepted/summary.json\n"
          if "MAIN_SHOWCASED_THEOREMS = {T3_FDSN: !!!!, R3_FDSN: !!!!}" not in index:
              if index_anchor not in index:
                  raise SystemExit("INDEX showcase insertion anchor not found")
              index = index.replace(index_anchor, index_anchor + status_lines, 1)
          index_path.write_text(index, encoding="utf-8")

      - name: Commit the showcase promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md GPT.txt INDEX-WORTHY.txt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "The FDSN showcase is already current."
            exit 0
          fi
          git commit -m "docs: showcase FDSN on T3 and R3 as !!!!"
          git push origin HEAD:main
