name: Refresh R3 InitialState owned-source hash

on:
  push:
    branches:
      - codex/nse-a-r3-ehrenfest
    paths:
      - .github/workflows/refresh-r3-initial-state-hash.yml
      - Material/MethbokeAddon/R3Ehrenfest/InitialState.lean

permissions:
  contents: write

concurrency:
  group: refresh-r3-initial-state-hash
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'randogelist/Methboke' && github.ref == 'refs/heads/codex/nse-a-r3-ehrenfest'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh exactly one owned-source digest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          source = Path('Material/MethbokeAddon/R3Ehrenfest/InitialState.lean')
          manifest = Path('Material/owned-sources.json')
          target = 'MethbokeAddon.R3Ehrenfest.InitialState'
          expected_imports = [
              'MethbokeAddon.R3Ehrenfest.DatumAdmission',
              'MethbokeAddon.R3Ehrenfest.Carrier',
              'MethbokeAddon.R3Ehrenfest.Bandlimited',
          ]

          digest = hashlib.sha256(source.read_bytes()).hexdigest()
          data = json.loads(manifest.read_text(encoding='utf-8'))
          matches = [entry for entry in data['modules'] if entry.get('module') == target]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one {target} entry, found {len(matches)}')
          entry = matches[0]
          if entry.get('path') != 'MethbokeAddon/R3Ehrenfest/InitialState.lean':
              raise SystemExit('unexpected InitialState path')
          if entry.get('imports') != expected_imports:
              raise SystemExit('InitialState import contract changed unexpectedly')

          old = entry.get('sha256')
          entry['sha256'] = digest
          manifest.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(f'{target}: {old} -> {digest}')
          PY

      - name: Commit the exact manifest repair
        shell: bash
        run: |
          if git diff --quiet -- Material/owned-sources.json; then
            echo 'Manifest already matches the source.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Material/owned-sources.json
          git commit -m 'Refresh R3 InitialState owned-source digest'
          git push origin HEAD:codex/nse-a-r3-ehrenfest
