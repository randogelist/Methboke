name: Finalize accepted R3 derivative layer

on:
  push:
    branches:
      - codex/nse-a-r3-ehrenfest
    paths:
      - .github/workflows/activate-r3-derivative-layer.yml
      - scripts/activate_r3_derivative_layer.py

permissions:
  actions: read
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      MATERIAL_EVIDENCE_ZIP: /tmp/material-evidence.zip
      R3_GOAL_EVIDENCE_ZIP: /tmp/r3-goal-evidence.zip
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: codex/nse-a-r3-ehrenfest
          fetch-depth: 0

      - name: Download exact accepted artifacts
        run: |
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/14698327135/zip > "$MATERIAL_EVIDENCE_ZIP"
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/14697488691/zip > "$R3_GOAL_EVIDENCE_ZIP"
          echo '1998d7708c7ead496d2fad9281715cc52ad84be9a4198b74656350126bfb985e  /tmp/material-evidence.zip' | sha256sum -c -
          echo '87a1e56eb7d86a854af7d0e38ab27a5f250b35ceed21c7b9edaf4ac5ebd0f8e8  /tmp/r3-goal-evidence.zip' | sha256sum -c -

      - name: Freeze evidence and synchronize ledgers
        run: python3 scripts/activate_r3_derivative_layer.py

      - name: Commit frozen acceptance
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No finalization changes produced'
            exit 1
          fi
          git commit -m 'Freeze accepted R3 derivative-representative mid-tier'
          git push origin HEAD:codex/nse-a-r3-ehrenfest
