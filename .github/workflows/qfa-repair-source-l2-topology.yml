name: QFA / one-shot raw source L2 topology repair

on:
  push:
    branches: [codex/qfa-structured-assembly]
    paths:
      - '.github/workflows/qfa-repair-source-l2-topology.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/qfa-structured-assembly
          fetch-depth: 1
      - name: Replace vector-valued topology transport by componentwise MemLp transport
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, json, sys
          from pathlib import Path

          root=Path.cwd(); material=root/'Material'; eid='QFASourceL2'
          ep=material/eid/'Endpoint.lean'
          text=ep.read_text()
          text=text.replace(
            'import Mathlib.MeasureTheory.Function.LpSpace.Basic\n',
            'import Mathlib.MeasureTheory.Function.LpSpace.Basic\n'
            'import Mathlib.MeasureTheory.SpecificCodomains.WithLp\n',1)

          old1='''theorem sourceFieldFunctionOfNative_memLp (a : SpatialL2) :
    MemLp (sourceFieldFunctionOfNative a) (2 : ℝ≥0∞)
      (volume : Measure SourceVec3) := by
  have hcomp :
      MemLp ((fun x : Space => a x) ∘ sourceToNative) (2 : ℝ≥0∞)
        (volume : Measure SourceVec3) :=
    (Lp.memLp a).comp_measurePreserving sourceToNative_measurePreserving
  have hmap := hcomp.continuousLinearMap_comp
    sourceNativeEquiv.symm.toContinuousLinearMap
  simpa [sourceFieldFunctionOfNative, Function.comp_def] using hmap
'''
          new1='''theorem sourceFieldFunctionOfNative_memLp (a : SpatialL2) :
    MemLp (sourceFieldFunctionOfNative a) (2 : ℝ≥0∞)
      (volume : Measure SourceVec3) := by
  have hcomp :
      MemLp (fun x : SourceVec3 => a (sourceToNative x)) (2 : ℝ≥0∞)
        (volume : Measure SourceVec3) :=
    (Lp.memLp a).comp_measurePreserving sourceToNative_measurePreserving
  apply MemLp.of_eval
  intro i
  have hi := hcomp.eval_piLp i
  simpa [sourceFieldFunctionOfNative, nativeToSource, sourceNativeEquiv] using hi
'''
          old2='''theorem nativeFieldFunctionOfSource_memLp
    (a : SourceVectorField)
    (ha : MemLp a (2 : ℝ≥0∞) (volume : Measure SourceVec3)) :
    MemLp (nativeFieldFunctionOfSource a) (2 : ℝ≥0∞)
      (volume : Measure Space) := by
  have hcomp :
      MemLp (a ∘ nativeToSource) (2 : ℝ≥0∞) (volume : Measure Space) :=
    ha.comp_measurePreserving nativeToSource_measurePreserving
  have hmap := hcomp.continuousLinearMap_comp sourceNativeEquiv.toContinuousLinearMap
  simpa [nativeFieldFunctionOfSource, Function.comp_def] using hmap
'''
          new2='''theorem nativeFieldFunctionOfSource_memLp
    (a : SourceVectorField)
    (ha : MemLp a (2 : ℝ≥0∞) (volume : Measure SourceVec3)) :
    MemLp (nativeFieldFunctionOfSource a) (2 : ℝ≥0∞)
      (volume : Measure Space) := by
  have hcomp :
      MemLp (fun x : Space => a (nativeToSource x)) (2 : ℝ≥0∞)
        (volume : Measure Space) :=
    ha.comp_measurePreserving nativeToSource_measurePreserving
  apply MemLp.of_eval_piLp
  intro i
  have hi := hcomp.eval i
  simpa [nativeFieldFunctionOfSource, sourceToNative, sourceNativeEquiv] using hi
'''
          old3='''private theorem sourceField_memLp_of_nativeField_memLp
    (a : SourceVectorField)
    (ha : MemLp (nativeFieldFunctionOfSource a) (2 : ℝ≥0∞)
      (volume : Measure Space)) :
    MemLp a (2 : ℝ≥0∞) (volume : Measure SourceVec3) := by
  have hcomp :
      MemLp ((nativeFieldFunctionOfSource a) ∘ sourceToNative) (2 : ℝ≥0∞)
        (volume : Measure SourceVec3) :=
    ha.comp_measurePreserving sourceToNative_measurePreserving
  have hmap := hcomp.continuousLinearMap_comp
    sourceNativeEquiv.symm.toContinuousLinearMap
  simpa [nativeFieldFunctionOfSource, Function.comp_def] using hmap
'''
          new3='''private theorem sourceField_memLp_of_nativeField_memLp
    (a : SourceVectorField)
    (ha : MemLp (nativeFieldFunctionOfSource a) (2 : ℝ≥0∞)
      (volume : Measure Space)) :
    MemLp a (2 : ℝ≥0∞) (volume : Measure SourceVec3) := by
  have hcomp :
      MemLp (fun x : SourceVec3 =>
        nativeFieldFunctionOfSource a (sourceToNative x)) (2 : ℝ≥0∞)
        (volume : Measure SourceVec3) :=
    ha.comp_measurePreserving sourceToNative_measurePreserving
  apply MemLp.of_eval
  intro i
  have hi := hcomp.eval_piLp i
  simpa [nativeFieldFunctionOfSource, sourceToNative, nativeToSource,
    sourceNativeEquiv] using hi
'''
          for old,new,label in [(old1,new1,'forward'),(old2,new2,'reverse'),(old3,new3,'private')]:
            if text.count(old)!=1:
              raise SystemExit(f'{label} proof block count={text.count(old)}')
            text=text.replace(old,new,1)
          ep.write_text(text)

          failure_dir=root/'audits/qfa-source-l2-52272c2c-failed'
          failure_dir.mkdir(parents=True,exist_ok=True)
          failure={
            'schema_version':1,'repository':'randogelist/Methboke',
            'branch':'codex/qfa-structured-assembly',
            'tested_source':'52272c2ce612ef168456cfcaa5fc63b67dc76fb3',
            'run_id':44922677288,
            'run_url':'https://github.com/randogelist/Methboke/actions/runs/44922677288',
            'status':'FAILED_NO_ACCEPTANCE','failure_phase':'compile',
            'failure_class':'MODULE_COMPILATION_FAILED',
            'failed_module':'QFASourceL2.Endpoint',
            'diagnostics':[
              {'line':48,'cause':'raw Pi product topology did not definitionally match the norm-topology codomain inferred by continuousLinearMap_comp'},
              {'line':77,'cause':'Euclidean PiLp topology did not definitionally match the raw-function topology inferred by continuousLinearMap_comp'}],
            'repair':'Replace whole-vector continuous-linear MemLp transport with componentwise eval/of_eval and eval_piLp/of_eval_piLp transport.',
            'statement_changes':False,'premise_changes':False,'audit_surface_changes':False,
            'compiler':'Lean 4.33.0 d8b18978322de05a8f3dba51ef03cf5461676c17',
            'mathlib':'db584cd6d46c92f209a44c0f1c829460d327499d',
            'dependency_cache':'EXACT','project_cache':'PREFIX',
            'evidence_artifact':14714073881,
            'evidence_sha256':'62dcfc3b391f2469c2486a74de22155fe0a411e76284f9aefa48d22b463c7445',
            'local_lean_executed':False}
          (failure_dir/'summary.json').write_text(json.dumps(failure,indent=2)+'\n')

          status=root/'R3_NSE/QFA/STRUCTURED_ASSEMBLY/PK02_SOURCE_L2_STATUS.txt'
          s=status.read_text()
          s=s.replace('STATUS = PENDING_MATCHING_EXTERNAL_CI',
            'STATUS = REPAIRED_PENDING_MATCHING_EXTERNAL_CI')
          s += '''\nFAILED_ATTEMPT\n==============\n\nSOURCE = 52272c2ce612ef168456cfcaa5fc63b67dc76fb3\nRUN = 44922677288\nFAILURE = Two codomain-topology definitional mismatches in whole-vector MemLp transport.\nREPAIR = Componentwise MemLp.eval/of_eval and eval_piLp/of_eval_piLp transport.\nSTATEMENTS_CHANGED = NO\nPREMISES_CHANGED = NO\nAUDIT_SURFACE_CHANGED = NO\nEVIDENCE = audits/qfa-source-l2-52272c2c-failed/summary.json\n'''
          status.write_text(s)

          sys.path.insert(0,str(material/'ci')); import build
          plan=build.validate(material)
          entry=next(e for e in plan['endpoints'] if e['id']==eid)
          closure={'schema_version':1,'endpoint':eid,
            'source_revision_status':'REPAIRED_PENDING_MATCHING_EXTERNAL_VERIFICATION',
            'source_baseline':'${{ github.sha }}','lean_toolchain':plan['toolchain'],
            'mathlib_commit':plan['mathlib_commit'],
            'roots':[entry['spec']['endpoint_module'],entry['spec']['audit_module']],
            'files':entry['files'],'external_imports':entry['external_imports'],
            'source_drift':entry['source_drift']}
          cb=(json.dumps(closure,indent=2,sort_keys=True)+'\n').encode()
          (material/eid/'closure.json').write_bytes(cb)
          ip=material/'endpoints.json'; idx=json.loads(ip.read_text())
          row=next(r for r in idx['endpoints'] if r['id']==eid)
          assert row['declarations']==7
          row['source_closure_sha256']=hashlib.sha256(cb).hexdigest()
          ip.write_text(json.dumps(idx,indent=2)+'\n')
          assert idx['endpoint_count']==174 and idx['declaration_count']==2256
          print(json.dumps({'endpoint':eid,'repair':'componentwise-MemLp',
            'public_declarations':7,'source_drift':entry['source_drift']},indent=2))
          PY
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/qfa-repair-source-l2-topology.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Material/QFASourceL2 Material/endpoints.json \
            R3_NSE/QFA/STRUCTURED_ASSEMBLY/PK02_SOURCE_L2_STATUS.txt \
            audits/qfa-source-l2-52272c2c-failed \
            .github/workflows/qfa-repair-source-l2-topology.yml
          git commit -m 'fix(qfa): repair raw source L2 topology transport'
          git push origin HEAD:codex/qfa-structured-assembly
